<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>大会ビューアー</title>
<style>
:root {
  --fg: #1a1a1a; --bg: #ffffff; --line: #999;
  --card: #f5f5f5; --accent: #0a5cc2; --done: #666;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #eeeeee; --bg: #151515; --line: #777;
    --card: #242424; --accent: #6db2ff; --done: #aaaaaa;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 12px;
  font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  color: var(--fg); background: var(--bg); line-height: 1.6;
}
h1 { font-size: 1.3rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; border-bottom: 1px solid var(--line);
     padding-bottom: 2px; margin: 18px 0 6px; }
h3 { font-size: 0.95rem; margin: 0 0 6px; }
button {
  font-size: 1rem; padding: 8px 14px; margin-right: 8px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--fg); cursor: pointer;
}
button[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 700; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#summary { margin: 4px 0; }
#updated { margin-left: 8px; color: var(--done); }
#live { min-height: 1.4em; margin: 6px 0; font-weight: 700; }
#error { color: #c2331a; min-height: 1.4em; margin: 2px 0; }
ul.matches { list-style: none; padding-left: 0; margin: 4px 0 12px; }
ul.matches li {
  padding: 6px 8px; margin: 4px 0; border-radius: 6px;
  background: var(--card); border-left: 5px solid transparent;
}
ul.matches li.st-ready { border-left-color: var(--accent); }
ul.matches li.st-done { color: var(--done); }
table { border-collapse: collapse; margin: 6px 0 12px; }
caption { text-align: left; font-weight: 700; margin-bottom: 4px; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
th { background: var(--card); }
.bracket-wrap { overflow-x: auto; }
.bracket { display: flex; gap: 16px; align-items: stretch; padding: 6px 0; }
.round-col {
  display: flex; flex-direction: column; justify-content: space-around;
  gap: 10px; min-width: 190px;
}
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 8px;
}
.card.st-ready { border: 2px solid var(--accent); }
.mrow { display: flex; gap: 6px; align-items: baseline; }
.mrow .pname { flex: 1; }
.mrow.win { font-weight: 700; }
.mark {
  font-size: 0.8rem; border: 1px solid currentColor;
  border-radius: 4px; padding: 0 4px;
}
.score { min-width: 1.2em; text-align: right; }
footer { margin-top: 24px; color: var(--done); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1 id="title" data-i18n="loading">読み込み中…</h1>
  <p id="summary"></p>
  <div class="controls" role="group" id="controls" aria-label="表示切替">
    <button id="mode-list" aria-pressed="true" data-i18n="modeList">リスト表示</button>
    <button id="mode-bracket" aria-pressed="false" data-i18n="modeBracket">ブラケット表示</button>
    <button id="reload" data-i18n="reload">今すぐ更新</button>
    <span id="updated"></span>
  </div>
  <p id="live" aria-live="polite"></p>
  <p id="error" role="status"></p>
</header>
<main>
  <section aria-labelledby="standings-h">
    <h2 id="standings-h" data-i18n="standings">順位・状況</h2>
    <div id="standings"></div>
  </section>
  <section id="list-view" aria-label="試合一覧(リスト)"></section>
  <section id="bracket-view" aria-label="試合一覧(ブラケット)" hidden>
    <div class="bracket-wrap" id="bracket-root"></div>
  </section>
</main>
<footer data-i18n="footer">15秒ごとに自動更新します。</footer>
<script>
"use strict";
// 画面の固定の文言。試合や順位の文はアプリが作ってスナップショットに入れる
// (その言語は data.lang)。データが届く前はブラウザの言語で選ぶ。
const STRINGS = {
  ja: {
    pageTitle: "大会ビューアー",
    loading: "読み込み中…",
    controls: "表示切替",
    modeList: "リスト表示",
    modeBracket: "ブラケット表示",
    reload: "今すぐ更新",
    standings: "順位・状況",
    listView: "試合一覧(リスト)",
    bracketView: "試合一覧(ブラケット)",
    footer: "15秒ごとに自動更新します。",
    noToken: "URLにトークンがありません。主催者から届いたURLをそのまま開いてください。",
    fetchFailed: (msg) => "取得に失敗しました(" + msg + ")。前回の内容を表示しています。",
    fetchFailedFirst: (msg) => "取得に失敗しました(" + msg + ")。しばらくすると自動でもう一度試します。",
    notFoundFirst: "このURLの大会はまだ公開されていないか、URLが変わりました。主催者に確認してください。",
    notFoundLater: "このURLでの公開は終わりました。表示は最後に届いた内容です。主催者に新しいURLを確認してください。",
    updated: "最終更新 ",
    liveUpdate: "更新: ",
    titleFormat: (title, fmt) => title + "(" + fmt + ")",
    colPlace: "順位", colPlayer: "選手", colWins: "勝", colLosses: "敗",
    colDiff: "得失差",
    secWinners: "ウィナーズ側", secLosers: "ルーザーズ側", secFinals: "決勝",
    markForfeit: "不戦勝", markBye: "不戦", markWin: "勝",
  },
  en: {
    pageTitle: "Tournament Viewer",
    loading: "Loading…",
    controls: "View",
    modeList: "List view",
    modeBracket: "Bracket view",
    reload: "Refresh now",
    standings: "Standings",
    listView: "Matches (list)",
    bracketView: "Matches (bracket)",
    footer: "This page refreshes every 15 seconds.",
    noToken: "The URL has no token. Open the URL exactly as the organizer sent it.",
    fetchFailed: (msg) => "Could not load the latest data (" + msg + "). Showing the last data received.",
    fetchFailedFirst: (msg) => "Could not load the data (" + msg + "). The page will try again shortly.",
    notFoundFirst: "This tournament is not published yet, or the URL has changed. Ask the organizer.",
    notFoundLater: "Publishing at this URL has ended. You are seeing the last data received. Ask the organizer for the new URL.",
    updated: "Last updated ",
    liveUpdate: "Update: ",
    titleFormat: (title, fmt) => title + " (" + fmt + ")",
    colPlace: "Place", colPlayer: "Player", colWins: "Wins", colLosses: "Losses",
    colDiff: "Game difference",
    secWinners: "Winners side", secLosers: "Losers side", secFinals: "Finals",
    markForfeit: "Forfeit win", markBye: "Bye", markWin: "Win",
  },
};
let lang = (navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en";
const S = () => STRINGS[lang];

// 固定の文言を言語に合わせる。見出しとページ名は render() がこのあと上書きする
function applyLanguage(code) {
  if (STRINGS[code]) lang = code;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => {
    e.textContent = S()[e.getAttribute("data-i18n")];
  });
  $("controls").setAttribute("aria-label", S().controls);
  $("list-view").setAttribute("aria-label", S().listView);
  $("bracket-view").setAttribute("aria-label", S().bracketView);
  document.title = S().pageTitle;
}

// 順位の表記はアプリが作る(place_label)。以前の版のアプリのデータには無い(日本語)
function placeLabel(label, n) {
  return label || (n + "位");
}

const params = new URLSearchParams(location.search);
const TOKEN = params.get("t") || "";
const RELAY = "tournament_relay.php";
let firstLoad = true;
let prevEvent = null;
let lastText = null;
let lastEtag = "";  // 前に受け取った内容の印(サーバーの ETag の中身)

const $ = (id) => document.getElementById(id);
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function showError(msg) { $("error").textContent = msg; }

async function load() {
  if (!TOKEN) {
    showError(S().noToken);
    return;
  }
  try {
    // no-cache: 毎回サーバーに確かめるが、変わっていなければ(304)本文は送られない。
    // 304 の判定に使うヘッダーを手前の中継が取り除くサーバーもあるので、
    // 前に受け取った内容の印を have でも知らせる(同じなら短い返事だけが返る)
    let url = RELAY + "?action=get&token=" + encodeURIComponent(TOKEN);
    if (lastEtag) url += "&have=" + encodeURIComponent(lastEtag);
    const res = await fetch(url, { cache: "no-cache" });
    if (res.status === 404) {
      // まだ公開されていないか、主催者が閲覧URLを作り直した
      if (firstLoad) $("title").textContent = S().pageTitle;
      showError(firstLoad ? S().notFoundFirst : S().notFoundLater);
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    // 内容が同じなら描き直さない(スクリーンリーダーで読んでいる位置を動かさない)
    if (text !== lastText) {
      const data = JSON.parse(text);
      // unchanged は「前と同じ」というサーバーの返事。画面はそのままにする
      if (data.unchanged !== true) {
        render(data);
        lastText = text;
        lastEtag = (res.headers.get("ETag") || "")
          .replace(/^W\//, "").replace(/"/g, "");
      }
    }
    showError("");
  } catch (e) {
    if (firstLoad) {
      $("title").textContent = S().pageTitle;
      showError(S().fetchFailedFirst(e.message));
    } else {
      showError(S().fetchFailed(e.message));
    }
  }
}

function render(data) {
  // 以前の版のアプリのスナップショットには lang が無い(日本語)
  const dataLang = data.lang || "ja";
  if (dataLang !== lang) applyLanguage(dataLang);
  document.title = data.title + " - " + S().pageTitle;
  $("title").textContent = S().titleFormat(data.title, data.format_name);
  $("summary").textContent = data.summary || "";
  try {
    const d = new Date(data.updated_at);
    $("updated").textContent = S().updated
      + d.toLocaleTimeString(lang === "ja" ? "ja-JP" : "en");
  } catch (e) { $("updated").textContent = ""; }

  if (!firstLoad && data.last_event && data.last_event !== prevEvent) {
    $("live").textContent = S().liveUpdate + data.last_event;
  }
  prevEvent = data.last_event;

  renderStandings(data);
  renderList(data);

  if (data.format === "round_robin") {
    // 総当たりにはブラケット表示が無い(作っても見えないので作らない)
    $("bracket-root").replaceChildren();
    $("mode-bracket").hidden = true;
    setMode("list");
  } else {
    renderBracket(data);
    $("mode-bracket").hidden = false;
  }
  firstLoad = false;
}

function renderStandings(data) {
  const root = $("standings");
  root.replaceChildren();
  if (data.league_table && data.league_table.length) {
    root.appendChild(buildTable(
      [S().colPlace, S().colPlayer, S().colWins, S().colLosses, S().colDiff],
      data.league_table.map(r =>
        [placeLabel(r.place_label, r.rank), r.name, r.wins, r.losses,
         (r.diff > 0 ? "+" : "") + r.diff])));
    return;
  }
  if (data.placements && data.placements.length) {
    root.appendChild(buildTable(
      [S().colPlace, S().colPlayer],
      data.placements.map(r => [placeLabel(r.place_label, r.place), r.name])));
    return;
  }
  const ul = el("ul", "matches");
  (data.standings_lines || []).forEach(line => {
    const li = el("li");
    li.textContent = line;
    ul.appendChild(li);
  });
  root.appendChild(ul);
}

function buildTable(headers, rows) {
  const t = el("table");
  const thead = el("thead");
  const trh = el("tr");
  headers.forEach(h => {
    const th = el("th");
    th.setAttribute("scope", "col");
    th.textContent = h;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  t.appendChild(thead);
  const tbody = el("tbody");
  rows.forEach(cells => {
    const tr = el("tr");
    cells.forEach(c => {
      const td = el("td");
      td.textContent = String(c);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  return t;
}

function renderList(data) {
  const root = $("list-view");
  root.replaceChildren();
  let curGroup = null;
  let ul = null;
  data.matches.forEach(m => {
    if (m.group !== curGroup) {
      curGroup = m.group;
      const h2 = el("h2");
      h2.textContent = m.group;
      root.appendChild(h2);
      ul = el("ul", "matches");
      root.appendChild(ul);
    }
    const li = el("li", "st-" + m.state);
    li.textContent = m.line;
    ul.appendChild(li);
  });
}

function renderBracket(data) {
  const root = $("bracket-root");
  root.replaceChildren();
  const sections = [
    [S().secWinners, ["winners", "league"]],
    [S().secLosers, ["losers"]],
    [S().secFinals, ["third_place", "grand_final", "grand_final_reset"]],
  ];
  sections.forEach(([name, phases]) => {
    const ms = data.matches.filter(m => phases.includes(m.phase));
    if (!ms.length) return;
    const sec = el("section");
    sec.setAttribute("aria-label", name);
    const wrap = el("div", "bracket");
    const rounds = new Map();
    ms.forEach(m => {
      const key = m.phase + ":" + m.round;
      if (!rounds.has(key)) rounds.set(key, []);
      rounds.get(key).push(m);
    });
    rounds.forEach(list => {
      const col = el("div", "round-col");
      const h3 = el("h3");
      h3.textContent = list[0].group;
      col.appendChild(h3);
      list.forEach(m => col.appendChild(card(m)));
      wrap.appendChild(col);
    });
    sec.appendChild(wrap);
    root.appendChild(sec);
  });
}

function card(m) {
  const d = el("div", "card st-" + m.state);
  d.setAttribute("role", "group");
  d.setAttribute("aria-label", m.line);
  d.appendChild(row(m, m.p1, m.s1, m.winner_slot === 1));
  d.appendChild(row(m, m.p2, m.s2, m.winner_slot === 2));
  return d;
}

function row(m, name, score, isWinner) {
  const r = el("div", "mrow" + (isWinner ? " win" : ""));
  const n = el("span", "pname");
  n.textContent = name;
  r.appendChild(n);
  if (isWinner) {
    const w = el("span", "mark");
    w.textContent = m.forfeit ? S().markForfeit
      : (m.auto ? S().markBye : S().markWin);
    r.appendChild(w);
  }
  if (score !== null && score !== undefined) {
    const s = el("span", "score");
    s.textContent = String(score);
    r.appendChild(s);
  }
  return r;
}

function setMode(mode) {
  const isList = mode === "list";
  $("list-view").hidden = !isList;
  $("bracket-view").hidden = isList;
  $("mode-list").setAttribute("aria-pressed", String(isList));
  $("mode-bracket").setAttribute("aria-pressed", String(!isList));
}

$("mode-list").addEventListener("click", () => setMode("list"));
$("mode-bracket").addEventListener("click", () => setMode("bracket"));
$("reload").addEventListener("click", load);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) load();
});
setInterval(() => { if (!document.hidden) load(); }, 15000);
applyLanguage(lang);
load();
</script>
</body>
</html>
